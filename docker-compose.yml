services:
  db:
    image: postgres:17-alpine
    container_name: dobrosmena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dobrosmena
      POSTGRES_USER: dobrosmena
      POSTGRES_PASSWORD: dobrosmena_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dobrosmena -d dobrosmena"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    container_name: dobrosmena-web
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: local-demo-secret-change-me
      DEBUG: "1"
      POSTGRES_DB: dobrosmena
      POSTGRES_USER: dobrosmena
      POSTGRES_PASSWORD: dobrosmena_local
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
      - ./backend/media:/app/media

volumes:
  postgres_data:
